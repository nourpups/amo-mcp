# Prebuilt image only. No build during publication.
name: amo-mcp
services:
  app:
    image: ${AMO_MCP_IMAGE:?Set an immutable sha256 image ID or registry digest}
    init: true
    restart: unless-stopped
    env_file: ${AMO_MCP_ENV_FILE:?Set absolute private runtime env path}
    ports:
      - "127.0.0.1:${AMO_MCP_PORT:-8765}:8765"
    volumes:
      - ${AMO_MCP_DATA_DIR:?Set private SQLite directory}:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8765/amo/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
